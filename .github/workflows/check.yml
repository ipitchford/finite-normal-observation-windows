name: Scoped example checks
on: [push, pull_request]
jobs:
  examples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Exact and numerical examples with semantic corruption controls
        run: python -B test_verification.py --out "$RUNNER_TEMP/example-checks"
      - uses: actions/upload-artifact@v4
        with:
          name: scoped-checks-${{ matrix.python-version }}
          path: ${{ runner.temp }}/example-checks
